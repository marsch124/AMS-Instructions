<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- AMS PomoTimer app icon: a hand-drawn tomato clock on a sunny ground. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE45C"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <linearGradient id="tom" x1="0.25" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#FF5C7A"/>
      <stop offset="1" stop-color="#E8123F"/>
    </linearGradient>
  </defs>
  <rect id="ground" width="512" height="512" rx="116" fill="url(#bg)"/>
  <g id="art" fill="none" stroke="#2A1442" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- shadow blob -->
    <path d="M150 396c66 16 150 16 214-2" stroke="#2A1442" stroke-opacity="0.22" stroke-width="26"/>
    <!-- tomato body, wobbly on purpose -->
    <path d="M258 168c-74-8-142 42-146 112-4 74 62 132 146 130 86-2 150-62 144-134-5-68-72-116-144-108z" fill="url(#tom)"/>
    <!-- highlight -->
    <path d="M166 250c9-26 28-44 54-54" stroke="#FFD0DB" stroke-width="16"/>
    <!-- leaves -->
    <path d="M256 172c-16-32-48-42-82-32 22 20 46 32 82 32z" fill="#3DE08A"/>
    <path d="M256 172c16-32 48-42 82-32-22 20-46 32-82 32z" fill="#3DE08A"/>
    <path d="M256 174c-4-28 6-48 24-64"/>
    <!-- clock hands -->
    <path d="M256 214v82l48 36" stroke-width="22"/>
    <circle cx="256" cy="296" r="15" fill="#2A1442" stroke="none"/>
  </g>
</svg>
